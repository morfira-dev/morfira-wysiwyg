name: Reproducible editor issue
description: Describe a reproducible issue without private documents or credentials.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic text and identifiers. Never include private documents, files, internal URLs, credentials or access tokens.
        You can prepare a local report in the documentation's Integration scenarios and feedback example. Nothing is submitted there automatically.
  - type: input
    id: version
    attributes:
      label: Installed package version
      placeholder: "@morfira-dev/wysiwyg 1.x.x"
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      options:
        - CMS article
        - Knowledge base with tables
        - Application form field
        - Other synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Selected modules and adapter
      description: Names only; no application URLs, customer names or identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected and actual behavior
      description: Use synthetic values. A reviewed report from the local example can be pasted here.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser family — optional
      placeholder: Chromium family, Firefox or Safari
  - type: checkboxes
    id: privacy
    attributes:
      label: Review before submitting
      options:
        - label: I removed private content, real IDs, internal addresses and secrets from this report.
          required: true
