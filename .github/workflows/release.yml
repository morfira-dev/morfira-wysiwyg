name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  pages-build:
    name: Build documentation for GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: checked-build-${{ github.sha }}
          path: ${{ runner.temp }}/checked-build
      - name: Restore the checked packages
        run: tar -xzf "$RUNNER_TEMP/checked-build/morfira-build.tar.gz"
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm run docs:build:site
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/.vitepress/dist
  pages-deploy:
    name: Deploy documentation to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  plan:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
      - if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo 'npm publication is inactive. Configure trusted publishers, then set NPM_PUBLISH_ENABLED=true.'
  publish:
    needs: [check, plan]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install npm CLI with OIDC support
        run: npm install --global npm@11.21.2
      - name: Verify publication runtime
        run: npm --version
      - uses: actions/download-artifact@v8
        with:
          name: checked-build-${{ github.sha }}
          path: ${{ runner.temp }}/checked-build
      - name: Restore the packages validated by this workflow
        run: tar -xzf "$RUNNER_TEMP/checked-build/morfira-build.tar.gz"
      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_WORKSPACES_UPDATE: 'false'
      - name: Notify published versions in Telegram
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: pnpm run release:notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_PROXY: ${{ secrets.TELEGRAM_BOT_PROXY }}
